  #         MARIADB_USER: ci
  #         MARIADB_PASSWORD: ci
  #         MARIADB_ROOT_PASSWORD: root
  #       ports: ["3306:3306"]
  #       options: >-
  #         --health-cmd="healthcheck.sh --connect --innodb_initialized"
  #         --health-interval=5s --health-timeout=5s --health-retries=10
